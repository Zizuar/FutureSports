name: Verify Cloudflare build

# Build-only check on GitHub. Deploy is handled by Cloudflare Workers Builds (GitHub OAuth).
# See docs/cloudflare-workers-builds.md

on:
  push:
    branches:
      - main
      - staging
  pull_request:
    branches:
      - main
      - staging

concurrency:
  group: build-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Sync image assets
        run: npm run sync:assets

      - name: Build for Cloudflare
        run: npm run build:cf
